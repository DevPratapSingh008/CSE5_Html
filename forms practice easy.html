<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic form designn using HTML </title>
</head>
<body>
    <h1>Greeks for Geeks</h1>
    <h3>Basic form designn using HTML</h3>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
        <label for="name">First Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your first name"><br><br>
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="Enter your last name"><br><br>
        <label for="gender">Gender:</label>
        <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>
       
        <label for="address">Address:</label>
        <textarea id="address" name="address" placeholder="Enter your address"></textarea>
<br><br>
        <label for="submit">Submit:</label>
        <input type="submit" value="Submit">
        </fieldset>
        
    </form>
</body>
</html>
